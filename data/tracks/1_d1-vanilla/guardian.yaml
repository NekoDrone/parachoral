title: Guardian
composers: [Michael Salvatori, Martin O'Donnell, C Paul Johnson]
description: "Title screen theme for the original version of Destiny. After Age of Triumph for Destiny, this is the title screen theme. For Destiny 2, in Edge of Fate and Renegades this was the title screen theme as both expansions did not have specific themes for the title screen. Renegades uses a slight remix. Since Monument of Triumph, the title screen music for destiny has been a stitched version of this track and Inner Light."
